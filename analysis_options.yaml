include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements

    # Style
    # Disabled: prefer_relative_imports (codebase uses package: convention)
    # Disabled: sort_constructors_first (MVVM part-files have intentional ordering)
    # Disabled: avoid_catches_without_on_clauses (services use bare catch intentionally)
    # Disabled: avoid_redundant_argument_values (explicit defaults document intent)
    - always_declare_return_types
    - avoid_catching_errors
    - avoid_slow_async_io
    - avoid_void_async
    - cast_nullable_to_non_nullable
    - combinators_ordering
    - eol_at_end_of_file
    - missing_whitespace_between_adjacent_strings
    - no_adjacent_strings_in_list
    - no_runtimeType_toString
    - noop_primitive_operations
    - only_throw_errors
    - prefer_asserts_in_initializer_lists
    - prefer_const_constructors
    - prefer_const_declarations
    # Dart string literals use double quotes throughout (see CLAUDE.md).
    - prefer_double_quotes
    - prefer_final_in_for_each
    - prefer_void_to_null
    - sized_box_shrink_expand
    - tighten_type_of_initializing_formals
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_breaks
    - unnecessary_lambdas
    - unnecessary_library_directive
    - unnecessary_null_aware_operator_on_extension_on_nullable
    - unnecessary_null_checks
    - unnecessary_raw_strings
    - use_colored_box
    - use_decorated_box
    - use_enums
    - use_is_even_rather_than_modulo
    - use_named_constants
    - use_string_buffers
    - use_test_throws_matchers

custom_lint:
  rules:
    # Complexity metrics (solid_lints). Run with: dart run custom_lint
    - cyclomatic_complexity:
      max_complexity: 15
    - number_of_parameters:
      max_parameters: 7
    - avoid_unnecessary_setstate
